<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Source art for the toolbar icon. Edit this, then regenerate the PNGs:
         cd extension && ./make-icons.sh
       A winding route on maillot yellow. Kept to one bold stroke because at
       16px, the size seen most beside the address bar, nothing finer
       survives; the switchbacks have to read as a path from the silhouette
       alone. (No double hyphen anywhere in here: XML forbids it in a
       comment, and rsvg-convert rejects the file outright.) -->
  <rect width="128" height="128" rx="26" fill="#ffdd00"/>
  <path d="M30 112
           C 30 92, 74 90, 74 70
           C 74 52, 30 50, 30 32
           C 30 18, 66 14, 98 16"
        fill="none" stroke="#101010" stroke-width="14"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
