<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Source art for the toolbar icon. Edit this, then regenerate the PNGs:
         cd extension && ./make-icons.sh
       Kept deliberately simple: at 16px only the silhouette survives, so the
       shape has to carry it without relying on the detail. Same maillot
       yellow and dark panel the bar itself uses. -->
  <rect width="128" height="128" rx="26" fill="#12151b"/>
  <!-- one climb, one descent, one summit finish: the profile in miniature -->
  <path d="M8 104 L28 92 L44 74 L58 84 L76 46 L92 62 L110 20 L120 24 L120 104 Z"
        fill="#ffdd00" fill-opacity="0.9"/>
  <path d="M8 104 L28 92 L44 74 L58 84 L76 46 L92 62 L110 20"
        fill="none" stroke="#ffe863" stroke-width="6"
        stroke-linejoin="round" stroke-linecap="round"/>
  <!-- the playhead: what the bar is actually for -->
  <rect x="86" y="14" width="6" height="98" rx="3" fill="#ffffff"/>
</svg>
