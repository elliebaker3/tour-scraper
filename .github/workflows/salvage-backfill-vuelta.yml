# Vuelta counterpart of salvage-backfill.yml -- same recovery, watching
# scrape-stage-vuelta instead and using config-vuelta.yaml throughout. See
# that file for the full rationale; nothing else differs.
name: salvage-backfill-vuelta

on:
  workflow_run:
    workflows: ["scrape-stage-vuelta"]
    types: [completed]

jobs:
  salvage:
    if: github.event.workflow_run.conclusion != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e .

      - name: Determine today's stage
        id: stage
        run: |
          python -m tourscraper --config config/config-vuelta.yaml bootstrap
          STAGE=$(python3 -c "
          import json, datetime
          data = json.load(open('data/vuelta/2026/reference/stages.json'))
          today = datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%d')
          matches = [s for s in data if str(s.get('date','')).startswith(today)]
          print(matches[0]['stage'] if matches else '')
          ")
          if [ -z "$STAGE" ]; then
            echo "::warning::no stage in stages.json matches today's date ($(date -u +%F)); nothing to salvage"
          fi
          echo "number=$STAGE" >> "$GITHUB_OUTPUT"

      - name: Archive-backfill cumulative feeds
        if: steps.stage.outputs.number != ''
        run: python -m tourscraper --config config/config-vuelta.yaml archive --stage "${{ steps.stage.outputs.number }}"

      - name: Commit recovered data
        if: steps.stage.outputs.number != ''
        run: |
          git config user.name "tour-scraper-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/vuelta/
          git commit -m "salvage(vuelta): archive-backfill stage ${{ steps.stage.outputs.number }} (scrape-stage-vuelta run did not succeed)" \
            || echo "nothing to commit"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "push attempt $i failed (concurrent write?), retrying..."
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done || echo "push failed after retries"
