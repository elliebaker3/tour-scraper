# La Vuelta a España counterpart of scrape-stage.yml. Same racecenter
# platform (confirmed 2026-08-22: /api/stage-2026, /api/allCompetitors-2026,
# /api/team-2026, /live-stream and every poll endpoint all answer on
# racecenter.lavuelta.es with the identical shape and SSE bind-name
# convention as racecenter.letour.fr -- this is the same vendor, rebranded),
# so this workflow reuses the exact same scrape-chunk.yml chaining as the
# Tour's, pointed at a different host and a separate data tree (`data/vuelta`,
# via config/config-vuelta.yaml) so a run here can never collide with a Tour
# capture in data/2026.
#
# Trigger design is DELIBERATELY DIFFERENT from the Tour's, after real
# failures: stage 6 (2026-08-27) fired ~9 hours late, and stage 7
# (2026-08-28) never fired at all -- both silent (the workflow reported
# healthy; nothing showed a red X), both only noticed days later when the
# displayed data turned out incomplete or missing outright. The Tour's
# scrape-stage.yml uses one precise cron per stage (start-90min discover,
# start-25min scrape); that is a SINGLE point of failure against exactly the
# GitHub Actions behaviour observed here -- `schedule` events are documented
# to be delayed or dropped under platform load, worse than the "occasionally
# tens of minutes late" this repo's own comments used to assume.
#
# So instead of one precise trigger per stage, this SWEEPS every 30 minutes
# across the whole plausible race window and figures out what to do from
# `determine`'s comparison of now vs. the day's actual stage schedule --
# meaning a single dropped or delayed tick costs at most 30 minutes' margin,
# not a whole stage. Idempotency (so the sweep doesn't restart an
# already-running or already-finished capture) is a plain existence check on
# that stage's own dated folder -- reliable now that stage_folder_date()
# (see storage.py) makes every chunk of one stage land in ONE folder no
# matter how late it runs, instead of splitting across two dates the way
# stage 6's post-midnight chunk did before that existed.
#
# max_hours is still DERIVED per stage from stages.json's own
# startTime/endTime (scheduled duration + 45min margin, clamped to [2.5h,
# 6h]) rather than a flat default -- the Vuelta's stages vary from a 9.4km
# stage 1 to a 214.5km stage 2, and a flat 5.5h would either waste runner
# time on the short ones or cut the finish off the longest.
#
# radio_stream_url is left BLANK in config-vuelta.yaml: unlike the Tour's
# L'Équipe radio (published statically in /api/event), the Vuelta's
# /api/event carried no radioUrl as of 2026-08-22 and `autodiscover` found no
# confident candidate either. Radio capture will simply no-op until one is
# found and added -- everything else is unaffected, since record_radio
# degrades gracefully with no URL configured.

name: scrape-stage-vuelta

on:
  # Every 30 minutes, 06:00-21:00 UTC -- wide enough to cover every stage
  # start time seen this Vuelta (09:xx-14:xx UTC) with generous margin on
  # both sides, without running all night for no reason.
  schedule:
    - cron: "0,30 6-21 * * *"
  workflow_dispatch:
    inputs:
      stage:
        description: "Stage number (e.g. 14) -- forces this stage regardless of today's date, and skips the idempotency check"
        required: false
      max_hours:
        description: "Hours to record (blank = derive from the stage's scheduled window)"
        default: ""
      run_discover:
        description: "Also run the discover job"
        type: boolean
        default: true

jobs:
  determine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      do_discover: ${{ steps.decide.outputs.do_discover }}
      do_scrape: ${{ steps.decide.outputs.do_scrape }}
      number: ${{ steps.decide.outputs.number }}
      chunk_hours: ${{ steps.decide.outputs.chunk_hours }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e .

      - name: Decide whether to discover/scrape, and which stage
        id: decide
        env:
          MANUAL_STAGE: ${{ github.event.inputs.stage }}
          MANUAL_HOURS: ${{ github.event.inputs.max_hours }}
          IS_DISPATCH: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
          RUN_DISCOVER_INPUT: ${{ github.event.inputs.run_discover }}
        run: |
          python -m tourscraper --config config/config-vuelta.yaml bootstrap
          python3 -c "
          import datetime, os
          from pathlib import Path
          from zoneinfo import ZoneInfo
          import json

          data = json.loads(Path('data/vuelta/2026/reference/stages.json').read_text())
          now = datetime.datetime.now(datetime.timezone.utc)
          today = now.strftime('%Y-%m-%d')
          is_dispatch = os.environ.get('IS_DISPATCH') == 'true'
          manual_stage = (os.environ.get('MANUAL_STAGE') or '').strip()

          if manual_stage:
              s = next((x for x in data if x.get('stage') == int(manual_stage)), None)
          else:
              matches = [x for x in data if str(x.get('date', '')).startswith(today)]
              s = matches[0] if matches else None

          out = {'do_discover': 'false', 'do_scrape': 'false', 'number': '', 'chunk_hours': ''}
          if s:
              n = s['stage']
              date_str = str(s['date'])[:10]
              tz = ZoneInfo(s.get('timezone') or 'UTC')
              start = datetime.datetime.fromisoformat(f\"{date_str}T{s['startTime']}\").replace(tzinfo=tz).astimezone(datetime.timezone.utc)
              end = datetime.datetime.fromisoformat(f\"{date_str}T{s['endTime']}\").replace(tzinfo=tz).astimezone(datetime.timezone.utc)
              sched_h = (end - start).total_seconds() / 3600
              total_hours = min(6.0, max(2.5, sched_h + 0.75))
              if manual_stage and os.environ.get('MANUAL_HOURS'):
                  total_hours = float(os.environ['MANUAL_HOURS'])

              out['number'] = str(n)
              out['chunk_hours'] = str(round(total_hours / 5, 3))

              if is_dispatch:
                  out['do_discover'] = 'true' if os.environ.get('RUN_DISCOVER_INPUT') == 'true' else 'false'
                  out['do_scrape'] = 'true'
              else:
                  # Discover window: from 100min before start to 15min after --
                  # cheap and idempotent server-side, so a handful of re-runs
                  # across this window (the 30min sweep ticks 3-4 times in it)
                  # cost little and only improve the odds of catching the
                  # profile CSV / radio URL before the stage needs them.
                  if start - datetime.timedelta(minutes=100) <= now <= start + datetime.timedelta(minutes=15):
                      out['do_discover'] = 'true'

                  # Scrape window: from 30min before start through the whole
                  # scheduled capture budget. Only fires once -- guarded by
                  # whether a REAL capture already started for this stage's
                  # own dated folder (which stage_folder_date() in storage.py
                  # guarantees every chunk of this stage writes into, however
                  # late it runs). Checking the manifest merely EXISTING is
                  # not enough: fetch_profiles()/autodiscover's saved profile
                  # CSV, and archive/backfill's salvage runs, both write a
                  # manifest entry into the same folder without ever starting
                  # live/poll capture -- caught locally before this went live,
                  # since it would have permanently blocked scraping any
                  # stage discover already touched or a salvage ran against.
                  stage_dir = Path('data/vuelta/2026') / f'stage-{n:02d}_{date_str}'
                  manifest_path = stage_dir / 'manifest.json'
                  already_started = False
                  if manifest_path.exists():
                      try:
                          entries = json.loads(manifest_path.read_text())
                          already_started = any(e.get('kind') in ('live-stream', 'poll', 'radio') for e in entries)
                      except (json.JSONDecodeError, TypeError):
                          already_started = False
                  if not already_started and start - datetime.timedelta(minutes=30) <= now <= start + datetime.timedelta(hours=total_hours):
                      out['do_scrape'] = 'true'

          gh_out = os.environ['GITHUB_OUTPUT']
          with open(gh_out, 'a') as f:
              for k, v in out.items():
                  f.write(f'{k}={v}\n')
          print('decision:', out)
          "

  discover:
    needs: determine
    if: needs.determine.outputs.do_discover == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install (incl. Playwright + headless Chromium)
        run: |
          pip install -e .
          playwright install --with-deps chromium

      - name: Run autodiscover
        run: python -m tourscraper --config config/config-vuelta.yaml autodiscover --watch-seconds 150

      - name: Commit any discovered config/data changes
        run: |
          git config user.name "tour-scraper-bot"
          git config user.email "actions@users.noreply.github.com"
          git add config/config-vuelta.yaml data/vuelta/
          git commit -m "autodiscover(vuelta): $(date -u +%F) findings" || echo "nothing to commit"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && break
            echo "push attempt $i failed (concurrent write?), retrying..."
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done || echo "push failed after retries; findings are still in the uploaded artifact"

      - name: Upload inventory as artifact too (belt and suspenders)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autodiscover-vuelta-${{ github.run_id }}
          path: data/vuelta/*/reference/autodiscover-endpoints.json
          retention-days: 30

  scrape-1:
    needs: determine
    if: needs.determine.outputs.do_scrape == 'true'
    uses: ./.github/workflows/scrape-chunk.yml
    permissions:
      contents: write
    secrets: inherit
    with:
      stage: ${{ needs.determine.outputs.number }}
      max_hours: ${{ needs.determine.outputs.chunk_hours }}
      part: "1"
      config: "config/config-vuelta.yaml"

  scrape-2:
    needs: [determine, scrape-1]
    if: always() && needs.determine.outputs.do_scrape == 'true'
    uses: ./.github/workflows/scrape-chunk.yml
    permissions:
      contents: write
    secrets: inherit
    with:
      stage: ${{ needs.determine.outputs.number }}
      max_hours: ${{ needs.determine.outputs.chunk_hours }}
      part: "2"
      config: "config/config-vuelta.yaml"

  scrape-3:
    needs: [determine, scrape-2]
    if: always() && needs.determine.outputs.do_scrape == 'true'
    uses: ./.github/workflows/scrape-chunk.yml
    permissions:
      contents: write
    secrets: inherit
    with:
      stage: ${{ needs.determine.outputs.number }}
      max_hours: ${{ needs.determine.outputs.chunk_hours }}
      part: "3"
      config: "config/config-vuelta.yaml"

  scrape-4:
    needs: [determine, scrape-3]
    if: always() && needs.determine.outputs.do_scrape == 'true'
    uses: ./.github/workflows/scrape-chunk.yml
    permissions:
      contents: write
    secrets: inherit
    with:
      stage: ${{ needs.determine.outputs.number }}
      max_hours: ${{ needs.determine.outputs.chunk_hours }}
      part: "4"
      config: "config/config-vuelta.yaml"

  scrape-5:
    needs: [determine, scrape-4]
    if: always() && needs.determine.outputs.do_scrape == 'true'
    uses: ./.github/workflows/scrape-chunk.yml
    permissions:
      contents: write
    secrets: inherit
    with:
      stage: ${{ needs.determine.outputs.number }}
      max_hours: ${{ needs.determine.outputs.chunk_hours }}
      part: "5"
      config: "config/config-vuelta.yaml"

  # Turns the raw capture scrape-1..5 committed into events.parsed.json
  # (ticker classified into crash/breakaway/etc, plus persons-of-interest
  # tagging) and stage_dir/navigator.json (time-synced elevation + those
  # events, when there's telemetry -- or, failing that, groups.jsonl -- to
  # sync against; see elevation_sync.py). Both steps are best-effort: a stage
  # with no usable track still gets its events parsed even though
  # navigator.json can't be time-synced.
  postprocess:
    needs: [determine, scrape-5]
    if: always() && needs.determine.outputs.do_scrape == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e .

      - name: Build events + navigator bundle for today's stage
        run: |
          git config user.name "tour-scraper-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin "${GITHUB_REF_NAME}"

          STAGE_NUM="${{ needs.determine.outputs.number }}"
          STAGE_DIR=$(ls -d data/vuelta/2026/stage-$(printf '%02d' "$STAGE_NUM")_* 2>/dev/null | head -1)
          if [ -z "$STAGE_DIR" ]; then
            echo "::warning::no stage directory found for stage $STAGE_NUM -- nothing to post-process"
            exit 0
          fi
          echo "stage dir: $STAGE_DIR"

          python -m tourscraper events "$STAGE_DIR" \
            || echo "::warning::events parsing failed (no publication capture?)"

          python -m tourscraper --config config/config-vuelta.yaml navigator \
            --stage "$STAGE_NUM" --stage-dir "$STAGE_DIR" \
            --telemetry "$STAGE_DIR/telemetry.jsonl" \
            --telemetry "$STAGE_DIR/telemetry.part-*.jsonl" \
            || echo "::warning::navigator bundle failed (likely no profile.csv or no length in stages.json)"

      - name: Commit results
        run: |
          git config user.name "tour-scraper-bot"
          git config user.email "actions@users.noreply.github.com"
          # extension/data/ too: navigator's publish_full_bundle / publish_lite_guideposts
          # write the extension-facing bundle there, separately from the raw
          # capture under data/vuelta/ -- missing it here meant a stage that
          # DID get time-synced (or km-placed) never actually reached the
          # extension, only the raw archive.
          git add data/vuelta/ extension/data/
          git commit -m "navigator(vuelta): stage ${{ needs.determine.outputs.number }} events + bundle" \
            || echo "nothing to commit"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && break
            echo "push attempt $i failed (concurrent write?), retrying..."
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done || echo "push failed after retries"
