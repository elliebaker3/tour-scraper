# One bounded-length capture session, called repeatedly (chained via `needs`)
# by scrape-stage.yml instead of running the whole stage as a single job.
#
# Why: stage 19 (2026-07-24) lost its runner to a GitHub-side "lost
# communication with the server" about 2h into a single 5.5h job, and
# everything since the last incremental push -- potentially hours -- died
# with the VM. That class of hosted-runner flakiness correlates with job
# duration; a 5.5h job has far more exposure than five ~66min ones. Splitting
# the capture into several short, independent jobs means a dead runner in
# chunk 3 costs at most one chunk (bounded further by the 300s incremental
# push inside it) -- chunk 4 starts on a FRESH runner regardless, because it
# only depends on chunk 3 having been attempted, not having succeeded.
#
# Each chunk writes its OWN files -- telemetry.part-3.jsonl and so on -- via
# --part. Sharing one append-only file across chunks meant the git merge
# between their commits decided which copy survived, and on stage 20 the
# shorter one won: 75MB of GPS became 5.9MB, losing 2.5 hours of the leader's
# position. Separate paths remove the question entirely rather than relying on
# a merge strategy to answer it correctly. The bundle builder already accepts
# several telemetry files, and --telemetry takes a glob.
#
# Trade-off accepted for this: record_radio's whole design is one persistent
# ffmpeg connection so no audio is dropped at hour boundaries (see its
# docstring). Each new chunk job starts a fresh ffmpeg process, so a few
# seconds of radio are genuinely lost at every chunk boundary -- the same
# small cost the docstring describes for an ffmpeg restart, just paid every
# ~66min instead of never. Losing a few seconds of audio five times is a much
# better trade than losing the rest of a stage's telemetry outright.
name: scrape-chunk

on:
  workflow_call:
    inputs:
      stage:
        required: true
        type: string
      max_hours:
        required: true
        type: string
      part:
        description: "Which chunk this is; labels its output files so no two chunks write the same path"
        required: true
        type: string
      config:
        description: "Path to a config.yaml override, e.g. config/config-vuelta.yaml. Empty = the Tour's default config/config.yaml."
        required: false
        type: string
        default: ""

jobs:
  chunk:
    runs-on: ubuntu-latest
    # Comfortably above max_hours (chunks are ~1.1h) with room for setup and
    # the final commit, but nowhere near GitHub's 6h hard cap -- the whole
    # point is not needing to run anywhere close to it anymore.
    timeout-minutes: 100
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -e .

      - name: Run capture chunk (with incremental pushes every 5 min)
        env:
          TOUR_RADIO_URL: ${{ secrets.TOUR_RADIO_URL }}
          # See config.py's TOUR_CAPTURE_ROOT: the live capture writes here,
          # outside the checkout, so git operations below never touch a path
          # its file handles are still open on. Root-caused on stage 13
          # (2026-09-04): 417 real position updates arrived over the raw SSE
          # connection across a full hour: only 31 survived to the pushed
          # file, or even the job's own uploaded artifact -- so the data was
          # gone before upload ran, not lost in transit. This is almost
          # certainly also what stage 20 (2026-07-25, see below) actually
          # was: rebase necessarily rewrites the exact file being
          # incrementally committed to replay that commit, on every single
          # incremental push, whether or not there's a real conflict --
          # which orphans the live writer's open descriptor. Everything it
          # appends after that point goes into a now-untracked inode that
          # vanishes when the process exits. No error, no warning.
          TOUR_CAPTURE_ROOT: ${{ runner.temp }}/tn-capture
        run: |
          git config user.name "tour-scraper-bot"
          git config user.email "actions@users.noreply.github.com"
          CFG=""
          if [ -n "${{ inputs.config }}" ]; then CFG="--config ${{ inputs.config }}"; fi
          mkdir -p "$TOUR_CAPTURE_ROOT"
          python -m tourscraper $CFG stage \
            --stage "${{ inputs.stage }}" \
            --max-hours "${{ inputs.max_hours }}" \
            --part "${{ inputs.part }}" &
          CAPTURE_PID=$!
          while kill -0 $CAPTURE_PID 2>/dev/null; do
            sleep 300
            kill -0 $CAPTURE_PID 2>/dev/null || break
            # Snapshot the live capture into the git tree BEFORE git touches
            # anything -- see TOUR_CAPTURE_ROOT above. rsync copies files git
            # is about to add/commit; the live writer's own file descriptors
            # stay open on paths under $TOUR_CAPTURE_ROOT the whole time,
            # which nothing below this line ever touches.
            rsync -a "$TOUR_CAPTURE_ROOT/" ./
            git add data/
            if git commit -m "data: incremental capture $(date -u +%H:%M) UTC" >/dev/null 2>&1; then
              # NOT -X theirs. With one long job that was safe: the only thing
              # to conflict with was unrelated repo activity, and favouring the
              # replayed capture commit kept an append-only file from
              # deadlocking the push. With CHUNKS it destroys data -- a later
              # chunk's shorter copy of telemetry.jsonl wins over the longer
              # one the previous chunk pushed. That is exactly what happened on
              # stage 20 (2026-07-25): the file reached 75MB by 11:52 and the
              # next commit replaced it with 5.9MB, losing 2.5 hours of the
              # leader's GPS. A plain rebase makes such a clash fail loudly and
              # retry instead of silently picking the smaller file.
              for attempt in 1 2 3; do
                if git pull --rebase origin "${GITHUB_REF_NAME}" >/dev/null 2>&1 \
                   && git push >/dev/null 2>&1; then
                  echo "pushed incremental at $(date -u +%H:%M)"; break
                fi
                git rebase --abort 2>/dev/null || true
                echo "incremental push attempt $attempt failed; retrying"
                sleep 10
              done
            fi
          done
          wait $CAPTURE_PID
          # Final snapshot: whatever the process wrote between the last
          # incremental sync and exit still needs to reach the git tree
          # before the "Commit data back to repo" step below runs.
          rsync -a "$TOUR_CAPTURE_ROOT/" ./

      - name: Upload chunk as artifact (belt and suspenders)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-${{ inputs.stage }}-part-${{ inputs.part }}-${{ github.run_id }}
          path: data/
          retention-days: 30

      - name: Commit data back to repo (excluding audio)
        if: always()
        run: |
          git config user.name "tour-scraper-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git commit -m "data: chunk capture $(date -u +%H:%M) UTC" || echo "nothing to commit"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && break
            echo "push attempt $i failed (concurrent write?), retrying..."
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done || echo "push failed after retries; data still in the uploaded artifact"
