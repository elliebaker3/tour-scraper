<!doctype html>
<!-- Test harness: stubs the chrome extension APIs so navigator.js can be loaded
     in a plain page and its rendering asserted. Copied into extension/ for the
     duration of a test run (it must be same-origin with data/) and deleted
     afterwards -- see tests/test_extension_profile.py. -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="navigator.css"></head>
<body style="margin:0;background:#111;height:100vh">
<script>
  const qs = new URLSearchParams(location.search);
  const pinned = qs.get("stage") ? Number(qs.get("stage")) : null;
  // storage.local is backed by REAL localStorage so writes survive a reload --
  // the calibration-persistence tests reload the page and assert the bar comes
  // back calibrated, which a swallow-everything stub could not exercise.
  const STUB_NS = "chromeStub:";
  const stubRead = () => {
    const out = {};
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k.startsWith(STUB_NS)) {
        try { out[k.slice(STUB_NS.length)] = JSON.parse(localStorage.getItem(k)); }
        catch (_) {}
      }
    }
    return out;
  };
  window.chrome = {
    runtime: {
      getURL: (p) => new URL(p, location.href).href,
      getManifest: () => ({ version: "0.0.0-harness" }),
    },
    storage: { local: {
      get: (keys, cb) => {
        const out = stubRead();
        if (pinned) out.tnPinnedStage = pinned;
        // Simulate a calibration left behind by an older extension version:
        // no `v`, and the rate-fitted 0.9178x that a two-pin fit produced.
        if (qs.get("stalecal") === "1") {
          out["tourNavigatorAnchors:stage-" + (pinned || 14)] = {
            v: 2,
            anchors: [{ tUtcMs: Date.parse("2026-07-18T11:35:38Z"), videoSec: 3549,
                        kind: "kmtogo", km: 0 }],
            cal: { refMs: Date.parse("2026-07-18T10:36:29Z"), offsetSec: 0, rate: 1 },
          };
        }
        cb(out);
      },
      remove: (key) => {
        for (const k of [].concat(key)) localStorage.removeItem(STUB_NS + k);
      },
      set: (obj, cb) => {
        for (const [k, v] of Object.entries(obj)) {
          localStorage.setItem(STUB_NS + k, JSON.stringify(v));
        }
        cb && cb();
      },
    } },
  };

  // Adding a reading also opens the prefilled share issue. Record the calls
  // instead of opening tabs, so a test can assert what would be contributed
  // (and that it isn't opened twice for the same payload) without leaving
  // github.com tabs behind every run.
  window.__opens = [];
  window.open = (u, target) => { window.__opens.push([u, target]); return null; };

  // Real values captured from the live Peacock player on the stage 14 replay:
  // displayStartTime 2026-07-18T10:30:00Z, runtime 5h20m26s. probe_main.js runs
  // in the page world here, which is the world the manifest gives it too.
  if (qs.get("playbackstate") === "1") {
    window.__PLAYBACK_STATE__ = { assetData: { attributes: {
      title: "Stage 14",
      displayStartTime: 1784370600000,
      eventDetails: {
        eventPlayableStartDate: 1784367000000,
        eventPlayableEndDate: 1784391707000,
      },
    } } };
  }

  // A stand-in for the player's own scrub bar, with ad markers ticked along
  // it the way Peacock draws them. ?adbreaks=1800,3600 places them at those
  // recording seconds. This is what detectAdBreaks() reads, so it exercises
  // the DOM scan and the local calibration layer together rather than
  // injecting the boundaries behind it.
  if (qs.get("adbreaks")) {
    const at = qs.get("adbreaks").split(",").map(Number).filter(n => n > 0);
    const dur = Number(qs.get("dur") || 19225.94);
    const bar = document.createElement("div");
    bar.className = "seekbar";
    Object.assign(bar.style, {
      position: "fixed", left: "0", bottom: "40px",
      width: "100vw", height: "6px", background: "#333",
    });
    for (const sec of at) {
      const m = document.createElement("div");
      m.className = "ad-marker";
      Object.assign(m.style, {
        position: "absolute", top: "0", height: "6px", width: "3px",
        background: "#ff0", left: `calc(${(sec / dur) * 100}% - 1.5px)`,
      });
      bar.appendChild(m);
    }
    document.addEventListener("DOMContentLoaded", () => document.body.appendChild(bar));
  }

  // Fake player: duration/currentTime are readonly on a real element, so they
  // are redefined here. Enabled only when ?video=1 so the no-video path is
  // exercised too.
  if (qs.get("video") === "1") {
    const v = document.createElement("video");
    // ?dur= overrides the stage 14 replay's real runtime, so a test can pose
    // as a DIFFERENT cut of the same stage and assert the fingerprint refuses
    // to restore another recording's calibration onto it.
    const dur = Number(qs.get("dur") || 19225.94);
    Object.defineProperty(v, "duration", { value: dur, configurable: true });
    let ct = Number(qs.get("t") || 0);
    Object.defineProperty(v, "currentTime", {
      get: () => ct, set: (x) => { ct = x; }, configurable: true,
    });
    document.body.appendChild(v);
  }
</script>
<script src="probe_main.js"></script>
<script src="probe.js"></script>
<script src="navigator.js"></script>
</body></html>
